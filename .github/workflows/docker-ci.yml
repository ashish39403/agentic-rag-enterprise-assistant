name: RAG Production CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

env:
  BACKEND_IMAGE: ashish731/rag-enterprise-backend
  FRONTEND_IMAGE: ashish731/rag-enterprise-frontend


jobs:

  # ---------------- CI: TEST ----------------
  test:
    name: Test RAG Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint code
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest -q


  # ---------------- CI: BUILD + PUSH ----------------
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend


  # ---------------- CD: DEPLOY EC2 ----------------
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            BACKEND_IMAGE="ashish731/rag-enterprise-backend"
            FRONTEND_IMAGE="ashish731/rag-enterprise-frontend"
            IMAGE_TAG="${{ github.sha }}"

            echo "Pulling new backend image..."
            sudo docker pull $BACKEND_IMAGE:$IMAGE_TAG

            echo "Pulling new frontend image..."
            sudo docker pull $FRONTEND_IMAGE:$IMAGE_TAG


            echo "Creating Docker network if required..."
            sudo docker network inspect rag-net >/dev/null 2>&1 || \
            sudo docker network create rag-net


            echo "Removing old containers..."
            sudo docker rm -f rag-backend 2>/dev/null || true
            sudo docker rm -f rag-frontend 2>/dev/null || true


            echo "Starting backend..."

            sudo docker run -d \
              --name rag-backend \
              --restart unless-stopped \
              --network rag-net \
              --env-file /home/ec2-user/.env \
              -p 8080:8080 \
              $BACKEND_IMAGE:$IMAGE_TAG


            echo "Starting frontend..."

            sudo docker run -d \
              --name rag-frontend \
              --restart unless-stopped \
              --network rag-net \
              -e BACKEND_URL=http://rag-backend:8080 \
              -p 8501:8501 \
              $FRONTEND_IMAGE:$IMAGE_TAG


            echo "Waiting for backend..."

            for i in {1..20}; do

              if curl -fsS http://localhost:8080/docs >/dev/null; then
                echo "Backend healthy"
                break
              fi

              if [ "$i" -eq 20 ]; then
                echo "Backend health check failed"
                sudo docker logs rag-backend
                exit 1
              fi

              sleep 3

            done


            echo "Waiting for frontend..."

            for i in {1..20}; do

              if curl -fsS http://localhost:8501/_stcore/health >/dev/null; then
                echo "Frontend healthy"
                break
              fi

              if [ "$i" -eq 20 ]; then
                echo "Frontend health check failed"
                sudo docker logs rag-frontend
                exit 1
              fi

              sleep 3

            done


            echo "Deployment successful"
            sudo docker ps